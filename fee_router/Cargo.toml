[package]
name = "fee_router"
version = "0.1.0"
edition = "2021"
description = "Protocol fee recipient that splits revenue across governance-configured sinks by timelocked weights"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
